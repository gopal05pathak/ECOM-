<!-- Here we are doing template inheritance means we will not repeat again and again the same thing of writing the same code in all the html pages which is require in every page like nav etc so we have made a basic.html in which we have written the code and we will use it in evry page by the use of
template ineritence -->


{% extends 'shop/basic.html' %}

{% block title %} This is contact {% endblock %}

{% block body %} 
<div class="container my-4">
    <h1>Contact Us Regarding Any Querry</h1>
    <form action="/shop/contact/" method="post">{% csrf_token %}
        <div class="form-group">
        <label for="Name">Name</label>
        <input class="form-control" id="name" name="name" type="text" placeholder="Enter Your Name">
        </div>
        <div class="form-group">
            <label for="Email">Email</label>
            <input class="form-control" id="email" name="email" type="text" placeholder="Enter Your Email">
        </div>
        <div class="form-group">
            <label for="Phone">Phone Number</label>
            <input class="form-control" name="phone" id="phone" type="tel" placeholder="Enter Your Phone No">
        </div>
        <br>
        <div class="form-group">
            <label for="desc">How May We Help You</label>
            <input class="form-control" id="desc" name="desc" rows="3">
        </div>
        <br>
        <button type="submit"  class="btn btn-success">Submit</button>

    </form>
</div>
{% endblock %}

{% block js %}
<script>
    {% if thank %}
    alert("Thanks for contact details are submitted. We will reach out to you soon!!");
    {% endif %}
</script>
{% endblock %}
